name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  mingw:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { msystem: MINGW64, project: mingw-gcc, bindir: win64_mingw-gcc }
          # - { msystem: CLANG64, project: mingw-clang, bindir: win64_mingw-clang }
    name: windows-${{ matrix.project }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bgfx
      - uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          path: bx
          fetch-depth: 0
      - run: git -C bx checkout 198cd12
        shell: bash
      - uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          path: bimg
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make
          pacboy: cc:p
      - name: Build
        shell: msys2 {0}
        run: |
          cd bgfx
          make shaderc -j$(nproc) AR=ar CC=cc CXX=c++ MINGW=$MINGW_PREFIX
      - name: Rename binary
        shell: bash
        run: cp bgfx/.build/${{ matrix.bindir }}/bin/shadercRelease.exe shaderc.exe
      - uses: actions/upload-artifact@v4
        with:
          name: shaderc-windows-x64-${{ matrix.project }}
          path: shaderc.exe
      - name: Zip binary
        run: Compress-Archive -Path shaderc.exe -Destination shaderc-windows-x64-${{ matrix.project }}.zip
      - name: Publish binary
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: shaderc-windows-x64-${{ matrix.project }}.zip
          tag_name: binaries
          fail_on_unmatched_files: true

  linux:
    name: linux-x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: bgfx
      - uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          path: bx
          fetch-depth: 0
      - run: git -C bx checkout 198cd12
      - uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          path: bimg
      - name: Build
        run: |
          sudo apt-get install -y libgl-dev
          cd bgfx
          make -j$(nproc) shaderc
      - name: Rename binary
        run: cp bgfx/.build/linux64_gcc/bin/shadercRelease shaderc
      - uses: actions/upload-artifact@v4
        with:
          name: shaderc-linux-x64
          path: shaderc
      - name: Zip binary
        run: zip shaderc-linux-x64.zip shaderc
      - name: Publish binary
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: shaderc-linux-x64.zip
          tag_name: binaries
          fail_on_unmatched_files: true

  macos:
    name: macos-x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bgfx
      - uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          path: bx
          fetch-depth: 0
      - run: git -C bx checkout 198cd12
      - uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          path: bimg
      - name: Build
        run: |
          cd bgfx
          make -j$(sysctl -n hw.physicalcpu) shaderc
      - name: Rename binary
        run: cp bgfx/.build/osx-x64/bin/shadercRelease shaderc
      - uses: actions/upload-artifact@v4
        with:
          name: shaderc-macos-x64
          path: shaderc
      - name: Zip binary
        run: zip shaderc-macos-x64.zip shaderc
      - name: Publish binary
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: shaderc-macos-x64.zip
          tag_name: binaries
          fail_on_unmatched_files: true

  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: arm, label: arm32 }
          - { platform: arm64, label: arm64 }
    name: android-${{ matrix.label }}
    runs-on: ubuntu-22.04
    steps:
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: false
      - uses: actions/checkout@v4
        with:
          path: bgfx
      - uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          path: bx
          fetch-depth: 0
      - run: git -C bx checkout 198cd12
      - uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          path: bimg
      - name: Build
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sudo apt-get install -y libgl-dev
          # NDK r25c lacks libpthread; create empty stubs
          ar -cr $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libpthread.a
          ar -cr $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libpthread.a
          cd bgfx
          make .build/projects/gmake-android-${{ matrix.platform }}
          make -j$(nproc) -R -C .build/projects/gmake-android-${{ matrix.platform }} shaderc config=release
      - name: Rename binary
        run: cp bgfx/.build/android-${{ matrix.platform }}/bin/libshadercRelease shaderc
      - uses: actions/upload-artifact@v4
        with:
          name: shaderc-android-${{ matrix.label }}
          path: shaderc
      - name: Zip binary
        run: zip shaderc-android-${{ matrix.label }}.zip shaderc
      - name: Publish binary
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: shaderc-android-${{ matrix.label }}.zip
          tag_name: binaries
          fail_on_unmatched_files: true
